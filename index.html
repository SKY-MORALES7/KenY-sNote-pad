<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note-pad</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="script.js"  defer></script>
</head>
<body>
  
<div class="container">
   <header class="header">
     <h1>Cool notes</h1>
     <p>Store your thoughts and ideas in style</p>
   </header>
</div>

<div class="controls">
    <div class="controls-container">
            <input
            type="text"
            id="searchInput"
            placeholder="Search notes..."
            class="search-input"
            />
              <button id="themeToggleBtn" class="add-btn">
                  <i class="fa fa-moon"></i> Theme
              </button>

    <div class="filter-group">
                <select id="filter-select">
                    <option value="all">All notes</option>
                    <option value="work">work</option>
                    <option value="personal">personal</option>
                    <option value="ideas">ideas</option>
                    <option value="reminders">Reminders</option>

                </select>
               <button id="addNoteBtn"  class="add-btn">
                    <i class="fa fa-plus" id="plus"></i>Add

               </button>
             </div>
    </div>
    </div>
 </div>

      <div id="notesContainer" class="notes-grid">
        <!-- notes added here -->

      </div>


      <div id="emptyState"  class="empty-state">
        <i class="fa fa-hospital-o" aria-hidden="true"></i>

        <h3>No notes</h3>
        <p>Add your first note by clicking the 'add button'</p>
      </div>


      <div id="addNoteModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">New Notes</h3>
                <button id="closeModalBtn" class="modal-close">
                    <i class="fa fa-times" aria-hidden="true"></i>

                </button>
                </div>
<form id="noteForm" class="modal-body">
    <div class="form-group">
      <label for="noteTitle" class="form-label">Title</label>
       <input type="text"  id="noteTitle"  class="form-input" required/>
    </div>

    <div class="form-group">
        <label for="noteContent" class="form-label">Content</label>
        <textarea
        id="noteContent"
        class="form-input form-textarea" required></textarea>
        
    </div>
    <div class="form-group">
        <label class="form-label">TAGS</label>
        <div class="tags-container">
            <label class="tag-option">
                <input
                type="radio"
                name="noteTag"
                value="work"
                class="tag-radio"
                checked
                />
                <span class="tag-label tag-work">
                    <i class="fa fa-briefcase" aria-hidden="true"></i>Work

                </span>
            </label>
            <label class="tag-option">
                    <input
                type="radio"
                name="noteTag"
                value="personal"
                class="tag-radio"
                />
                <span class="tag-label tag-personal">
                    <i class="fa fa-user" aria-hidden="true"></i>personal

                </span>
            </label>
            <label class="tag-option">
                <input
                type="radio"
                name="noteTag"
                value="ideas"
                class="tag-radio"
               
                />
            <span class="tag-label tag-ideas">
        <i class="fa-regular fa-lightbulb" aria-hidden="true"></i>ideas
                </span>
            </label>
            <label class="tag-option">
                <input
                type="radio"
                name="noteTag"
                value="reminders"
                class="tag-radio"
                
                />
            <span class="tag-label tag-reminders">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>Reminder
                </span>
            </label>
        </div>
        
    </div>
    
    <button type="submit" class="submit-btn">Save Note</button>
      
    
</form>
        
        </div>
      </div>


 </div>
 <div id="viewModal" class="view-modal">
  <div class="view-content">
    <span id="closeViewModal" class="close-btn">&times;</span>
    <h2 id="viewTitle"></h2>
    <p id="viewText"></p>
    <span id="viewTag" class="note-tag"></span>
  </div>
</div>

</body>
</html>
